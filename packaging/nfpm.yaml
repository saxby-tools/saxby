#  =====================================================================
#  nfpm — .deb and .rpm from a built release
#  =====================================================================
#  Scaffolding, not a maintained repository. nfpm reads the version,
#  architecture and staged directory from the environment, so this
#  file needs no rendering. From the repository root, after
#  `deno task build`:
#
#    VERSION=1.0.0 ARCH=amd64 \
#      STAGE=dist/saxby-1.0.0-linux-x64 \
#      nfpm pkg --packager deb -f packaging/nfpm.yaml --target dist/
#
#  ARCH is nfpm's name: amd64 for linux-x64, arm64 for linux-arm64.
#  Use --packager rpm for an .rpm.
#
#  No service files: `saxby service install` sets up a per-user
#  service, and a package installs system-wide.

name: saxby
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Niko Lowry <niko@neeks.me>
description: |
    Local-first LLM routing daemon. Sits in front of an
    OpenAI-compatible backend and routes each request to the right
    local model, logging every decision.
homepage: https://github.com/saxby-tools/saxby
license: AGPL-3.0-or-later

#  `expand: true` is per entry: without it nfpm takes ${STAGE}
#  literally in src and dst. version and arch expand on their own.
contents:
    - src: ${STAGE}/saxbyd
      dst: /usr/bin/saxbyd
      expand: true
      file_info:
          mode: 0755
    - src: ${STAGE}/saxby
      dst: /usr/bin/saxby
      expand: true
      file_info:
          mode: 0755
    - src: ${STAGE}/LICENSE
      dst: /usr/share/licenses/saxby/LICENSE
      expand: true
