#  =====================================================================
#  Release
#  =====================================================================
#  A pushed v* tag builds all four targets and opens a DRAFT release
#  with the tarballs, checksums and rendered packaging files. Nothing
#  is published until a human clicks Publish.
#
#  "Run workflow" from the Actions tab is a dry run: the same build,
#  uploaded as workflow artifacts, with no release and no tag.
#
#  macOS runner on purpose: cross-compiling every target from a Mac is
#  the path that has been tested. Darwin binaries cross-compiled from
#  Linux have not been.
#
#  Actions are pinned to full commit SHAs, so a moved tag cannot change
#  what runs here. Deno is pinned to the version the compiled
#  binaries' abort semantics were checked on (docs/releasing.md).

name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: macos-latest

        #  Signing needs the Developer ID certificate and the notary key
        #  from the repository secrets (docs/releasing.md). A fork, or a
        #  dry run before they exist, builds unsigned and says so.
        env:
            CAN_SIGN: ${{ secrets.MACOS_SIGNING_P12 != '' }}

        steps:
            #  actions/checkout v7.0.1
            - name: Check out
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            #  denoland/setup-deno v2.0.5
            - name: Set up Deno
              uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
              with:
                  deno-version: 2.9.6

            - name: Test
              run: deno task test

            - name: Type-check
              run: >-
                  deno check
                  packages/cli/src/main.js
                  packages/llm-router/src/main.js
                  scripts/build.js
                  scripts/package.js
                  scripts/version.js

            - name: Tag matches package version
              if: github.event_name == 'push'
              run: >-
                  deno run --allow-read scripts/version.js
                  --expect "${GITHUB_REF_NAME#v}"

            - name: Build
              run: deno task build all

            - name: Import the signing certificate
              if: env.CAN_SIGN == 'true'
              env:
                  P12_BASE64: ${{ secrets.MACOS_SIGNING_P12 }}
                  P12_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
              run: |
                  keychain="$RUNNER_TEMP/signing.keychain-db"
                  password="$(uuidgen)"
                  security create-keychain -p "$password" "$keychain"
                  security set-keychain-settings -lut 3600 "$keychain"
                  security unlock-keychain -p "$password" "$keychain"
                  printf '%s' "$P12_BASE64" \
                      | base64 --decode > "$RUNNER_TEMP/signing.p12"
                  security import "$RUNNER_TEMP/signing.p12" \
                      -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
                  rm "$RUNNER_TEMP/signing.p12"
                  security set-key-partition-list \
                      -S apple-tool:,apple:,codesign: \
                      -s -k "$password" "$keychain"
                  security list-keychains -d user \
                      -s "$keychain" login.keychain-db
                  identity="$(security find-identity -v -p codesigning \
                      "$keychain" \
                      | grep 'Developer ID Application' | head -1 \
                      | sed -E 's/.*"(.*)"/\1/')"
                  test -n "$identity"
                  echo "SAXBY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

            - name: Sign and notarize the macOS binaries
              if: env.CAN_SIGN == 'true'
              env:
                  NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
                  SAXBY_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
                  SAXBY_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
              run: |
                  printf '%s' "$NOTARY_KEY_P8" \
                      | base64 --decode > "$RUNNER_TEMP/notary.p8"
                  SAXBY_NOTARY_KEY="$RUNNER_TEMP/notary.p8" deno task sign-macos
                  rm "$RUNNER_TEMP/notary.p8"

            - name: Unsigned build
              if: env.CAN_SIGN != 'true'
              run: >-
                  echo "No signing certificate in the secrets;
                  the darwin binaries are unsigned."

            - name: Verify checksums
              working-directory: dist
              run: shasum -a 256 -c *.sha256

            - name: Smoke-test the native binary
              run: ./dist/saxby-*-darwin-arm64/saxby --version

            - name: Render packaging
              run: deno task package all

            #  actions/upload-artifact v7.0.2
            - name: Upload (dry run)
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: saxby-dry-run
                  path: |
                      dist/*.tar.gz
                      dist/*.sha256
                      dist/packaging/
                  if-no-files-found: error

            #  v0.* and -suffixed tags (v1.1.0-rc.1) are pre-releases:
            #  GitHub hides them from "latest" until a human says so.
            - name: Draft release
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  pre=""
                  case "$GITHUB_REF_NAME" in
                      v0.* | *-*) pre="--prerelease" ;;
                  esac
                  gh release create "$GITHUB_REF_NAME" \
                      --draft \
                      --verify-tag \
                      $pre \
                      --title "Saxby $GITHUB_REF_NAME" \
                      --generate-notes \
                      dist/*.tar.gz \
                      dist/*.sha256 \
                      dist/packaging/PKGBUILD \
                      dist/packaging/saxby.rb
